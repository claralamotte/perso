<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salésienne de Paris - Carte de la saison 2026-2027</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00AB60; --mint:#DBF9F1; --amber:#F5B82E;
  --green-ink:#007A45; --amber-ink:#8A5E00;
  --deep:#0B3D2E; --ink:#123328; --muted:#6E8A7E;
  --card:rgba(255,255,255,.82); --cardline:rgba(11,61,46,.10);
  --radius:16px; --shadow:0 14px 40px rgba(11,61,46,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#map{position:absolute;inset:0;z-index:1;background:
  radial-gradient(120% 120% at 50% 30%, #FFFFFF 0%, var(--mint) 60%, #CDEEE4 100%)}
.leaflet-container{font-family:inherit;background:transparent}

/* Brand card */
.brand{position:absolute;top:16px;left:16px;z-index:1000;display:flex;align-items:center;gap:12px;
  background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--cardline);
  border-radius:var(--radius);padding:12px 16px 12px 12px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.crest{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.brand h1{font-size:15px;font-weight:700;color:var(--deep);line-height:1.15;white-space:nowrap}
.brand p{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.crest img{width:100%;height:100%;object-fit:contain}
.crest{overflow:visible;background:transparent;border-radius:0;box-shadow:none;width:46px;height:46px}
.rtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--green);padding:1px 7px;border-radius:999px;vertical-align:middle;margin-left:2px}

/* Controls */
.controls{position:absolute;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.seg{display:inline-flex;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--cardline);
  border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);
  padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .18s;white-space:nowrap}
.seg button.on{background:var(--green);color:#fff}
.legend{display:flex;gap:14px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--cardline);
  border-radius:999px;padding:8px 14px;box-shadow:var(--shadow)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink)}
.dot-l{width:11px;height:11px;border-radius:50%;flex-shrink:0}

/* Map labels */
.city,.cname{pointer-events:none}
.cdot{display:inline-block;width:4px;height:4px;border-radius:50%;background:#95A3AA;vertical-align:middle;margin-right:4px}
.cname{font-size:9.5px;font-weight:500;color:#849099;white-space:nowrap;vertical-align:middle}
.cdot-p{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--deep);vertical-align:middle;margin-right:5px}
.cname-p{font-size:13px;font-weight:600;color:var(--deep);letter-spacing:.02em;vertical-align:middle}
.pclabel{font-size:10px;font-weight:600;font-style:italic;color:rgba(11,140,128,.95);white-space:nowrap;letter-spacing:.03em}
.rlabel{font-size:10px;font-weight:600;font-style:italic;color:rgba(95,150,175,.95);white-space:nowrap;letter-spacing:.03em}
.compass{position:absolute;bottom:56px;left:14px;z-index:1000;width:34px;height:34px;border-radius:50%;
  background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--cardline);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--deep)}
.compass b{color:var(--green)}
.leaflet-control-scale-line{background:rgba(255,255,255,.7);border-color:var(--cardline);color:var(--ink);font-family:'DM Sans',sans-serif;border-radius:0 0 4px 4px}

/* Chips (markers): glass fill, coloured text, no border, dashed leader + dot */
.pin{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;
  filter:drop-shadow(0 5px 10px rgba(11,61,46,.18))}
.pin-home{height:78px;--c:#00AB60}
.pin-away{height:72px;--c:#F5B82E}
.chip{position:relative;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap;
  line-height:1.05;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:transform .16s ease}
.chip .sub{display:block;font-size:9px;font-weight:500;letter-spacing:.02em;margin-top:3px;opacity:.92}
.chip .cdate{font-weight:700}
.chip .cadv{font-weight:500}
.chip-home{background:linear-gradient(rgba(0,171,96,.16),rgba(0,171,96,.16)),rgba(255,255,255,.58);color:var(--green-ink);text-align:center}
.chip-away{background:linear-gradient(rgba(245,184,46,.15),rgba(245,184,46,.15)),rgba(255,255,255,.82);color:#F5B82E;text-shadow:0 1px 1.5px rgba(11,61,46,.30)}
.lead{width:0;height:20px;border-left:1.6px dashed var(--c)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.78)}
.numdot{min-width:18px;height:17px;border-radius:999px;background:linear-gradient(rgba(245,184,46,.22),rgba(245,184,46,.22)),rgba(255,255,255,.9);color:#F5B82E;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px rgba(255,255,255,.9);text-shadow:0 1px 1px rgba(11,61,46,.28)}
.pinb{display:flex;align-items:center;gap:3px}
.tbadge{min-width:16px;height:16px;border-radius:999px;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.pin:hover .chip{transform:translateY(-2px)}
.pin.next .chip::after{content:"prochain match";position:absolute;left:50%;top:0;transform:translate(-50%,-155%);
  font-size:8px;font-weight:700;color:#fff;background:var(--deep);padding:2px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.pin.next .chip{animation:pulseN 1.8s ease-in-out infinite}
.pin-home.next .chip{background:var(--green);color:#fff;text-shadow:none}
.pin-away.next .chip{background:#F5B82E;color:#fff;text-shadow:0 1px 2px rgba(90,60,0,.55)}
@keyframes pulseN{0%,100%{box-shadow:0 0 0 0 rgba(11,61,46,.4)}50%{box-shadow:0 0 0 9px rgba(11,61,46,0)}}
@media(prefers-reduced-motion:reduce){.pin.next .chip{animation:none}}

/* Panel */
.panel{position:absolute;top:0;right:0;height:100%;width:380px;max-width:90vw;z-index:1100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-left:1px solid var(--cardline);
  box-shadow:-12px 0 40px rgba(11,61,46,.14);transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:translateX(0)}
.panel-head{padding:20px 22px 14px;position:relative;flex-shrink:0}
.panel-body{padding:0 22px 26px;overflow-y:auto}
.px{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--cardline);
  background:#fff;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.tag-home{background:var(--green);color:#fff}
.tag-away{background:var(--amber);color:#4a3505}
.oppo{display:flex;align-items:center;gap:14px;margin:14px 0 6px}
.badge{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;font-size:17px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.badge.has-logo{background:#fff;border-radius:14px;overflow:hidden}
.badge.has-logo img{background:transparent;padding:4px}
.oppo h2{font-size:19px;font-weight:700;color:var(--deep);line-height:1.15}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:30px}
.dtchip{font-size:11px;font-weight:700;color:var(--deep);background:var(--mint);border-radius:999px;padding:5px 12px;white-space:nowrap;flex-shrink:0}
.oppo-txt{min-width:0}
.addr{font-size:12px;color:var(--muted);font-weight:500;margin-top:5px;display:flex;align-items:flex-start;gap:5px;line-height:1.35}
.oppo .when{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px;text-transform:capitalize}
.scorec{display:inline-flex;align-items:center;gap:8px;margin:14px 0 2px;padding:7px 14px;border-radius:999px;font-weight:700}
.scorec .scl{font-size:12px} .scorec .scn{font-size:14px}
.scorec-win{background:rgba(0,171,96,.14);color:var(--green)}
.scorec-draw{background:rgba(245,184,46,.20);color:#9A6B00}
.scorec-loss{background:rgba(192,67,77,.12);color:#C0434D}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:16px 0 4px;padding:14px 16px;border-radius:14px;background:var(--mint)}
.score .n{font-size:26px;font-weight:700;color:var(--deep)}
.score .lab{font-size:11px;font-weight:600;color:var(--muted)}
.score.win{background:rgba(0,171,96,.14)} .score.win .n{color:var(--green)}
.score.loss{background:rgba(11,61,46,.06)} .score.loss .n{color:var(--muted)}
.score.draw{background:rgba(245,184,46,.20)} .score.draw .n{color:#a9760a}
.score.todo{flex-direction:column;align-items:flex-start;gap:2px;background:rgba(11,61,46,.045)}
.score.todo .lab{font-size:13px;font-weight:700;color:var(--ink)}
.score.todo .sub2{font-size:11px;color:var(--muted);font-weight:500}
.res{width:100%;flex-basis:100%;font-size:12px;font-weight:700;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.field{background:#fff;border:1px solid var(--cardline);border-radius:12px;padding:10px 12px}
.field.wide{grid-column:1 / -1}
.field .k{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .v{font-size:13px;font-weight:600;color:var(--ink);margin-top:4px}
.field .v.todo{color:#b98a12}
.field .v .est{font-weight:500;color:var(--muted);font-size:11px}
.field .v a{color:var(--green);font-weight:700;text-decoration:none;white-space:nowrap}
.field .v a:hover{text-decoration:underline}
.travel{margin-top:14px;background:#fff;border:1px solid var(--cardline);border-radius:14px;padding:14px 14px 12px}
.travel-h{font-size:12px;font-weight:700;color:var(--deep)}
.travel-h span{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mode{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;
  background:var(--mint);border-radius:12px;padding:12px 6px;transition:transform .15s ease, box-shadow .15s ease}
.mode:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,171,96,.18)}
.mode-ic{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--green)}
.mode-ic svg{width:18px;height:18px}
.mode-lab{font-size:10.5px;font-weight:600;color:var(--ink)}
.mode-val{font-size:11px;font-weight:700;color:var(--green)}
.travel-note{font-size:10px;color:var(--muted);margin-top:10px;font-weight:500;line-height:1.4}
.section-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.forml{margin-top:2px}
.formr{display:grid;grid-template-columns:24px 42px 1fr 54px;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid var(--cardline);font-size:12px}
.formr:last-child{border-bottom:none}
.fres{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.fr-V{background:var(--green)} .fr-N{background:var(--amber);color:#4a3505} .fr-D{background:#D0555F}
.fdt{color:var(--muted);font-weight:600;font-size:11px}
.fvs{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fvs .ha{font-size:9px;color:var(--muted);font-weight:700;margin-right:4px}
.fsc{font-weight:700;justify-self:end;font-size:11px;padding:2px 9px;border-radius:999px;background:transparent;border:1px solid currentColor;white-space:nowrap}
.fsc-V{color:var(--green)} .fsc-N{color:#C8930C} .fsc-D{color:#C0434D}
.sstabs{display:flex;gap:6px;margin:2px 0 6px}
.sstab{flex:1;border:1px solid var(--cardline);background:#fff;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);padding:7px;border-radius:10px;cursor:pointer;transition:all .15s}
.sstab.on{background:var(--green);color:#fff;border-color:var(--green)}
.stbl{margin-top:2px}
.str{display:grid;grid-template-columns:26px 1fr 22px 32px 32px;align-items:center;gap:4px;padding:7px 6px;border-bottom:1px solid var(--cardline);font-size:12px;color:var(--ink)}
.str:last-child{border-bottom:none}
.sthead{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.stp{font-weight:700;color:var(--deep)}
.stme{background:rgba(0,171,96,.10);border-radius:8px}
.stme .stn,.stme .stp{color:var(--green);font-weight:700}
.stopp{background:rgba(245,184,46,.22);border-radius:8px}
.stopp .stn,.stopp .stp{color:#9A6B00;font-weight:700}
.cal-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--cardline);cursor:pointer}
.cal-row:last-child{border-bottom:none}
.cal-date{width:52px;flex-shrink:0;text-align:center}
.cal-date .d{font-size:16px;font-weight:700;color:var(--deep);line-height:1}
.cal-date .m{font-size:9px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.cal-oppo{flex:1;min-width:0}
.cal-oppo .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-oppo .hr{font-size:11px;color:var(--muted)}
.cal-res{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--green);flex-shrink:0}
.loc{font-size:9px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:2px}
.loc-d{background:rgba(0,171,96,.14);color:var(--green)}
.loc-e{background:rgba(245,184,46,.16);color:#F5B82E;text-shadow:0 1px 1px rgba(11,61,46,.22)}
.cal-res.todo{background:rgba(11,61,46,.05);color:var(--muted);font-weight:600}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--card);
  backdrop-filter:blur(12px);border:1px solid var(--cardline);border-radius:999px;padding:8px 16px;
  font-size:11.5px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}

@media(max-width:700px){
  .brand h1{font-size:13px;white-space:normal}
  .controls{top:auto;bottom:14px;right:14px;left:14px;flex-direction:row;justify-content:center;flex-wrap:wrap}
  .legend{display:none}.hint{display:none}
  .panel{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;height:auto;max-height:76vh;
    border-left:none;border-top:1px solid var(--cardline);border-radius:20px 20px 0 0;
    transform:translateY(100%);box-shadow:0 -12px 40px rgba(11,61,46,.18)}
  .panel.open{transform:translateY(0)}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="brand" onclick="showSeason()" style="cursor:pointer" title="Voir le calendrier complet">
  <div class="crest"><img id="crestimg" alt="SP"></div>
  <div><h1>Salésienne de Paris <span class="rtag">R3</span></h1><p>1er · classement &amp; calendrier</p></div>
</div>

<div class="controls">
  <div class="seg" id="seg">
    <button data-f="all" class="on">Tous</button>
    <button data-f="Domicile">Domicile</button>
    <button data-f="Extérieur">Extérieur</button>
  </div>
  <div class="legend">
    <span><i class="dot-l" style="background:var(--green)"></i>Domicile</span>
    <span><i class="dot-l" style="background:var(--amber)"></i>Déplacement</span>
  </div>
</div>

<div class="hint">Cliquez sur une pastille pour voir le match</div>
<div class="compass"><b>N</b>&#9650;</div>

<div class="panel" id="panel">
  <div class="panel-head"><button class="px" onclick="closePanel()">&#10005;</button><div id="panel-head"></div></div>
  <div class="panel-body" id="panel-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ============================================================
   SOURCE : donnees integrees (hors ligne) par defaut.
   Pour lire la Google Sheet EN DIRECT : Fichier > Partager >
   Publier sur le web > feuille "Calendrier" en CSV, puis coller
   l'URL ci-dessous. La carte se met a jour a chaque ouverture.
   ============================================================ */

const MOIS=["jan","fév","mar","avr","mai","juin","juil","aoû","sep","oct","nov","déc"];
const MOIS_L=["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
function dtChip(d,h){const p=(d||"").split("/");if(p.length!==3)return d;return (+p[0])+" "+MOIS_L[(+p[1])-1]+" · "+fmtH(h);}
function parseDate(s){const p=(s||"").split("/");if(p.length!==3)return null;return new Date(+p[2],+p[1]-1,+p[0]);}
function chipDate(s){const p=(s||"").split("/");if(p.length!==3)return s;return (+p[0])+" "+MOIS[(+p[1])-1];}
function longDate(s){const d=parseDate(s);if(!d)return s;return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtH(h){return (h||"").replace(":","h");}
function rdv(h){const p=(h||"").split(":");if(p.length<2)return "-";let t=(+p[0])*60+(+p[1])-90;if(t<0)t+=1440;return Math.floor(t/60)+"h"+String(t%60).padStart(2,"0");}
function initials(n){const w=(n||"").replace(/[^A-Za-zÀ-ÿ0-9 ]/g," ").trim().split(/\s+/).filter(x=>x&&isNaN(x));return ((w[0]||"")[0]||"?").toUpperCase()+((w[1]||"")[0]||"").toUpperCase();}
function played(m){return m.sS!==""&&m.sS!=null&&m.sA!==""&&m.sA!=null;}
function badgeHTML(m){if(m.logo)return '<div class="badge has-logo"><img src="'+m.logo+'" onerror="this.parentNode.textContent=\''+initials(m.adv)+'\'"></div>';return '<div class="badge">'+initials(m.adv)+'</div>';}
function mapsLink(m,mode){return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(HOME.addr)+"&destination="+m.lat+","+m.lng+"&travelmode="+(mode||"driving");}
function distKm(m){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(m.lat-HOME.lat),dLng=rad(m.lng-HOME.lng);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(HOME.lat))*Math.cos(rad(m.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
function fmtDur(min){if(min<60)return min+" min";const h=Math.floor(min/60),r=min%60;return h+"h"+(r?String(r).padStart(2,"0"):"00");}
function bikeEst(m){const min=Math.max(5,Math.round(distKm(m)*1.25/15*60/5)*5);return "env. "+fmtDur(min);}
function metroEst(m){const min=Math.round((20+distKm(m)*1.25/25*60)/5)*5;return "env. "+fmtDur(min);}

function modeCard(m,mode,icon,lab,val){return '<a class="mode" href="'+mapsLink(m,mode)+'" target="_blank" rel="noopener"><span class="mode-ic">'+icon+'</span><span class="mode-lab">'+lab+'</span><span class="mode-val">'+val+'</span></a>';}
function buildTravel(m){return '<div class="travel"><div class="travel-h">Comment y aller <span>depuis la Porte d\'Asnières</span></div>'+
  '<div class="modes">'+
   modeCard(m,'transit',ICON.metro,'Métro / RER',metroEst(m))+

   modeCard(m,'driving',ICON.car,'Voiture',m.trajet||'Voir')+
  '</div><div class="travel-note">Estimations approximatives (hors trafic). Temps réel, horaires et itinéraire exact en cliquant.</div></div>';}

let map,layer,currentFilter="all",nextKey=null;

/* live sheet loader */
function mapRow(r){const g=(k)=>{for(const key in r){if(key.trim().toLowerCase()===k)return (r[key]||"").toString().trim();}return "";};
  return {j:g("journee")||g("journée"),date:g("date"),heure:g("heure"),lieu:g("lieu"),adv:g("adversaire"),ville:g("ville"),
    stade:g("stade / adresse")||g("stade"),lat:parseFloat((g("latitude")||"").replace(",",".")),lng:parseFloat((g("longitude")||"").replace(",",".")),
    logo:g("logo (url)")||g("logo"),classt:g("classement n-1"),division:g("division / poule")||g("division"),
    sS:g("score salesienne")||g("score salésienne"),sA:g("score adversaire"),trajet:g("trajet")||"",notes:g("notes")};}
function loadData(cb){if(!SHEET_CSV_URL){cb();return;}
  Papa.parse(SHEET_CSV_URL,{download:true,header:true,skipEmptyLines:true,
    complete:function(res){try{const rows=res.data.map(mapRow).filter(x=>x.date&&!isNaN(x.lat)&&!isNaN(x.lng));if(rows.length)MATCHES=rows;}catch(e){console.warn(e);}cb();},
    error:function(e){console.warn(e);cb();}});}

function computeNext(){const now=new Date();now.setHours(0,0,0,0);let best=null;
  MATCHES.forEach(m=>{const d=parseDate(m.date);if(d&&d>=now&&(!best||d<parseDate(best.date)))best=m;});nextKey=best?best.j:null;}

/* schematic Paris (lines only) */
function smooth(pts,closed,seg){
  seg=seg||14;const n=pts.length,res=[];
  const get=i=>closed?pts[((i%n)+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
    for(let t=0;t<seg;t++){const s=t/seg,s2=s*s,s3=s2*s;
      res.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*s+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*s+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)
      ]);}}
  res.push(closed?res[0]:pts[n-1]);return res;
}

function build(){
  if(layer)layer.remove();
  layer=L.layerGroup().addTo(map);
  const bounds=[];
  const homeMatches=MATCHES.filter(m=>m.lieu==="Domicile").sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  if(currentFilter!=="Extérieur" && homeMatches.length){
    const isNext=homeMatches.some(m=>String(m.j)===String(nextKey));
    const html='<div class="pin pin-home'+(isNext?' next':'')+'"><div class="chip chip-home">Porte d\'Asnières<span class="sub">'+homeMatches.length+' matchs</span></div><div class="lead"></div><div class="dot"></div></div>';
    L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:'',html:html,iconSize:[172,78],iconAnchor:[86,78]}),zIndexOffset:1000}).addTo(layer).on('click',showHome);
    bounds.push([HOME.lat,HOME.lng]);
  }
  MATCHES.filter(m=>m.lieu==="Extérieur").forEach(m=>{
    if(currentFilter==="Domicile")return;
    const isNext=String(m.j)===String(nextKey);
    const rl=played(m)?(+m.sS>+m.sA?'V':(+m.sS<+m.sA?'D':'N')):'';
    const sc=rl?' ('+rl+')':'';
    const html='<div class="pin pin-away'+(isNext?' next':'')+'"><div class="chip chip-away"><span class="cdate">'+chipDate(m.date)+sc+'</span><span class="sub cadv">'+m.adv+'</span></div><div class="lead"></div><div class="numdot">#'+m.j+'</div></div>';
    L.marker([m.lat,m.lng],{icon:L.divIcon({className:'',html:html,iconSize:[150,72],iconAnchor:[75,72]})}).addTo(layer).on('click',()=>showMatch(m));
    bounds.push([m.lat,m.lng]);
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[80,80],maxZoom:12.5});
}

function openPanel(){document.getElementById('panel').classList.add('open');}
function closePanel(){document.getElementById('panel').classList.remove('open');}

function scoreBlock(m){
  if(!played(m))return '<div class="score todo"><div class="lab">Score final à venir</div><div class="sub2">il s\'affichera ici une fois le score saisi</div></div>';
  const s=+m.sS,a=+m.sA,cls=s>a?'win':(s<a?'loss':'draw'),lab=s>a?'Victoire':(s<a?'Défaite':'Match nul');
  return '<div class="scorec scorec-'+cls+'"><span class="scl">'+lab+'</span><span class="scn">'+m.sS+' - '+m.sA+'</span></div>';
}
function field(k,v,todo){return '<div class="field"><div class="k">'+k+'</div><div class="v'+(todo?' todo':'')+'">'+v+'</div></div>';}

function showMatch(m){
  const isHome=m.lieu==="Domicile";
  const tag=isHome?'<span class="tag tag-home">Domicile</span>':'<span class="tag tag-away">Déplacement</span>';
  const addr=isHome?HOME.addr:(m.stade||'Adresse à renseigner');
  document.getElementById('panel-head').innerHTML=
    '<div class="ph-top">'+tag+'<span class="dtchip">'+dtChip(m.date,m.heure)+'</span></div>'+
    '<div class="oppo">'+badgeHTML(m)+'<div class="oppo-txt"><h2>'+m.adv+'</h2>'+
      '<div class="addr">📍 '+addr+'</div></div></div>';
  let body='';
  if(played(m)) body+=scoreBlock(m);
  body+='<div class="grid2">'+
    field("Coup d'envoi",fmtH(m.heure),false)+
    '<div class="field"><div class="k">Transport</div><div class="v" style="display:flex;align-items:center;gap:6px">'+
      (m.tr?'<span class="tbadge" style="position:static;background:'+m.tr.c+';color:'+m.tr.t+';box-shadow:none">'+m.tr.b+'</span>'+m.tr.name:'à préciser')+'</div></div>'+
  '</div>';
  body+=standingsHTML(m.adv);
  body+=formHTML(m.adv);
  if(!isHome) body+=buildTravel(m);
  document.getElementById('panel-body').innerHTML=body;
  openPanel();
}

function formHTML(adv){
  const f=FORM[adv]; if(!f||!f.length) return '';
  let h='<div class="section-lbl">Derniers résultats · '+adv+'</div><div class="forml">';
  f.forEach(r=>{const res=r.gf>r.ga?'V':(r.gf<r.ga?'D':'N');
    h+='<div class="formr"><span class="fres fr-'+res+'">'+res+'</span>'+
       '<span class="fdt">'+r.d+'</span>'+
       '<span class="fvs"><span class="ha">'+(r.ha==="dom"?'Dom.':'Ext.')+'</span>'+r.vs+'</span>'+
       '<span class="fsc fsc-'+res+'">'+r.gf+' - '+r.ga+'</span></div>';});
  h+='</div>';return h;
}
function standingsHTML(adv){
  let h='<div class="section-lbl">Classement · au 2 oct. 2026</div><div class="stbl">'+
    '<div class="str sthead"><span>Pos</span><span class="stn">Équipe</span><span>J</span><span>Pts</span><span>Dif</span></div>';
  STANDINGS.forEach(s=>{const me=s.t==="Salésienne de Paris";const opp=adv&&s.t===adv;
    const cls=me?' stme':(opp?' stopp':'');
    h+='<div class="str'+cls+'"><span>'+s.pos+'</span><span class="stn">'+s.t+'</span><span>'+s.j+'</span><span class="stp">'+s.pts+'</span><span>'+(s.dif>0?'+':'')+s.dif+'</span></div>';});
  h+='</div>';return h;
}
function calendarHTML(){
  const list=MATCHES.slice().sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  let h='';
  list.forEach(m=>{const p=(m.date||"").split("/");
    const dom=m.lieu==="Domicile";
    const loc='<span class="loc '+(dom?'loc-d':'loc-e')+'">'+(dom?'Domicile':'Extérieur')+'</span>';
    const res=played(m)?'<span class="cal-res">'+m.sS+' - '+m.sA+'</span>':'<span class="cal-res todo">à venir</span>';
    h+='<div class="cal-row" data-j="'+m.j+'"><div class="cal-date"><div class="d">'+p[0]+'</div><div class="m">'+MOIS[(+p[1])-1]+'</div></div>'+
      '<div class="cal-oppo"><div class="nm">Match '+m.j+' · '+m.adv+'</div><div class="hr">'+loc+' · '+fmtH(m.heure)+'</div></div>'+res+'</div>';});
  return h;
}
function showSeason(){
  document.getElementById('panel-head').innerHTML='<span class="tag tag-home">Saison 2026 - 2027 · R3</span>'+
    '<div class="oppo"><div class="badge has-logo"><img src="'+SAL_LOGO+'" alt="SP"></div>'+
    '<div><h2>Salésienne de Paris</h2><div class="when" style="text-transform:none">1er · 6 pts · 18 matchs</div></div></div>';
  let body='<div class="sstabs"><button class="sstab on" data-v="cls">Classement</button><button class="sstab" data-v="cal">Calendrier</button></div>'+
    '<div id="ss-cls">'+standingsHTML()+'</div>'+
    '<div id="ss-cal" style="display:none">'+calendarHTML()+'</div>';
  const pb=document.getElementById('panel-body');
  pb.innerHTML=body;
  pb.querySelectorAll('.cal-row').forEach(row=>{
    row.addEventListener('click',()=>{const m=MATCHES.find(x=>String(x.j)===row.dataset.j);if(m)showMatch(m);});});
  pb.querySelectorAll('.sstab').forEach(b=>{b.addEventListener('click',()=>{
    pb.querySelectorAll('.sstab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const cls=b.dataset.v==='cls';
    document.getElementById('ss-cls').style.display=cls?'':'none';
    document.getElementById('ss-cal').style.display=cls?'none':'';});});
  openPanel();
}

function showHome(){
  const list=MATCHES.filter(m=>m.lieu==="Domicile").sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  document.getElementById('panel-head').innerHTML='<span class="tag tag-home">Stade à domicile</span>'+
    '<div class="oppo"><div class="badge has-logo"><img src="'+SAL_LOGO+'" alt="SP"></div>'+
    '<div><h2>Porte d\'Asnières</h2><div class="when" style="text-transform:none">'+HOME.stade+', '+HOME.ville+'</div></div></div>';
  let body='<div class="section-lbl">Calendrier à domicile · '+list.length+' matchs</div>';
  list.forEach(m=>{const p=(m.date||"").split("/");
    const res=played(m)?'<span class="cal-res">'+m.sS+' - '+m.sA+'</span>':'<span class="cal-res todo">à venir</span>';
    body+='<div class="cal-row" data-j="'+m.j+'"><div class="cal-date"><div class="d">'+p[0]+'</div><div class="m">'+MOIS[(+p[1])-1]+'</div></div>'+
      '<div class="cal-oppo"><div class="nm">'+m.adv+'</div><div class="hr">'+fmtH(m.heure)+' · RDV '+rdv(m.heure)+'</div></div>'+res+'</div>';});
  document.getElementById('panel-body').innerHTML=body;
  document.getElementById('panel-body').querySelectorAll('.cal-row').forEach(row=>{
    row.addEventListener('click',()=>{const m=MATCHES.find(x=>String(x.j)===row.dataset.j);if(m)showMatch(m);});});
  openPanel();
}

function init(){
  var _ce=document.getElementById("crestimg"); if(_ce)_ce.src=SAL_LOGO;
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([48.86,2.32],11);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.control.scale({metric:true,imperial:false,position:'bottomleft'}).addTo(map);
  drawIDF();
  computeNext();
  build();
  document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');currentFilter=b.dataset.f;build();});
}
loadData(init);
</script>
